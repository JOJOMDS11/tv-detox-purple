name: Test IMDb Watchlist

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test IMDb Watchlist pagination and title fields
        run: |
          python - <<'PY'
          import json
          import urllib.request

          endpoint = "https://api.graphql.imdb.com/"
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "x-imdb-client-name": "imdb-web-next",
          }

          def query(q, variables):
              body = json.dumps({
                  "query": q,
                  "variables": variables
              }).encode()
              req = urllib.request.Request(
                  endpoint, data=body, headers=headers, method="POST"
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read())
              if result.get("errors"):
                  raise RuntimeError(str(result["errors"][0]))
              return result["data"]

          profile = query(
              "query($profileId: ID!) { userProfile(input: {profileId: $profileId}) { userId } }",
              {"profileId": "p.kdmpbgbkxrrigqfvco4fujud3i"}
          )
          user_id = profile["userProfile"]["userId"]

          gql = """
            query($userId: ID!, $first: Int!, $after: String) {
              predefinedList(classType: WATCH_LIST, userId: $userId) {
                titleListItemSearch(first: $first, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  edges {
                    title {
                      id
                      titleText { text }
                      primaryImage { url }
                      releaseYear { year }
                    }
                  }
                }
              }
            }
          """

          after = None
          total = 0
          page = 0

          print("IMDb user ID resolvido:", user_id)

          while True:
              data = query(gql, {
                  "userId": user_id,
                  "first": 50,
                  "after": after
              })

              watchlist = data["predefinedList"]
              if watchlist is None:
                  raise RuntimeError("Watchlist pública não encontrada.")

              connection = watchlist["titleListItemSearch"]
              edges = connection["edges"]
              page += 1
              total += len(edges)

              print(f"Página {page}: {len(edges)} títulos")

              if page == 1:
                  for edge in edges[:5]:
                      title = edge["title"]
                      image = title.get("primaryImage") or {}
                      year = title.get("releaseYear") or {}
                      print(json.dumps({
                          "id": title.get("id"),
                          "titulo": (title.get("titleText") or {}).get("text"),
                          "ano": year.get("year"),
                          "poster": image.get("url")
                      }, ensure_ascii=False))

              info = connection["pageInfo"]
              if not info["hasNextPage"]:
                  break
              if not info.get("endCursor"):
                  raise RuntimeError("IMDb indica outra página, mas não forneceu cursor.")
              after = info["endCursor"]

          print("TOTAL DE TÍTULOS:", total)
          print("PAGINAÇÃO COMPLETA: OK")
          PY