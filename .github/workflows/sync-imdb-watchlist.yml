name: Sync IMDb Watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: imdb-watchlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load previous JSON
        run: |
          git fetch origin watchlist-data || true
          git show origin/watchlist-data:public/watchlist.json > /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json

      - name: Fetch complete IMDb Watchlist
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import calendar
          import json
          import os
          import urllib.request
          from datetime import date, datetime, timezone

          endpoint = "https://api.graphql.imdb.com/"
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "x-imdb-client-name": "imdb-web-next",
          }
          profile_id = "p.kdmpbgbkxrrigqfvco4fujud3i"

          TEMPLATE = """
          query($userId: ID!, $first: Int!, $after: String) {
            predefinedList(classType: WATCH_LIST, userId: $userId) {
              titleListItemSearch(first: $first, after: $after) {
                pageInfo { hasNextPage endCursor }
                edges {
                  title {
                    id
                    titleText { text }
                    primaryImage { url }
                    releaseYear { year }
                    __EXTRA__
                  }
                }
              }
            }
          }
          """

          # Campos opcionais: cada um é testado sozinho; os que o IMDb recusar ficam de fora.
          OPTIONAL = [
              ["titleType { id }"],
              ["ratingsSummary { aggregateRating }"],
              ["metacritic { metascore { score } }"],
              ["genres { genres { text } }", "titleGenres { genres { genre { text } } }"],
              ["runtime { seconds }"],
              ["releaseDate { year month day }"],
          ]

          # Detalhes do popup (sinopse, diretor, elenco; em inglês, como o IMDb entrega).
          # Também testados um a um; se algum for recusado, o resto continua funcionando.
          DETAIL = [
              ["plot { plotText { plainText } }"],
              [
                  'directors: credits(first: 2, filter: { categories: ["director"] }) { edges { node { name { nameText { text } } } } }',
                  'directors: principalCredits(filter: { categories: ["director"] }) { credits { name { nameText { text } } } }',
              ],
              [
                  'cast: credits(first: 5, filter: { categories: ["cast"] }) { edges { node { name { nameText { text } } } } }',
                  'cast: principalCredits(filter: { categories: ["cast"] }) { credits { name { nameText { text } } } }',
              ],
          ]

          # Mesmas listas das páginas moviemeter e tvmeter do IMDb (mais populares da semana).
          CHARTS = {"topMovies": "MOST_POPULAR_MOVIES", "topSeries": "MOST_POPULAR_TV_SHOWS"}
          TOP_FIELDS = "id titleText { text } primaryImage { url } releaseYear { year } __EXTRA__"
          TOP_TEMPLATES = [
              "query { chartTitles(first: 10, chart: { chartType: __CHART__ }) { edges { node { " + TOP_FIELDS + " } } } }",
              "query { chartTitles(first: 10, chart: { chartType: __CHART__ }) { edges { node { title { " + TOP_FIELDS + " } } } } }",
          ]


          def query(q, variables):
              body = json.dumps({"query": q, "variables": variables}).encode()
              req = urllib.request.Request(endpoint, data=body, headers=headers, method="POST")
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read())
              if result.get("errors"):
                  raise RuntimeError(str(result["errors"][0]))
              return result["data"]


          def extract_genres(item):
              names = []
              for entry in (item.get("genres") or {}).get("genres") or []:
                  text = (entry or {}).get("text")
                  if text:
                      names.append(text)
              for entry in (item.get("titleGenres") or {}).get("genres") or []:
                  text = ((entry or {}).get("genre") or {}).get("text")
                  if text:
                      names.append(text)
              return names


          def release_text(item):
              release = item.get("releaseDate") or {}
              y, m, d = release.get("year"), release.get("month"), release.get("day")
              if not y:
                  return ""
              if m and d:
                  return f"{y:04d}-{m:02d}-{d:02d}"
              if m:
                  return f"{y:04d}-{m:02d}"
              return f"{y:04d}"


          def is_upcoming(release, year):
              today = datetime.now(timezone.utc).date()
              if release:
                  parts = [int(p) for p in release.split("-")]
                  if len(parts) == 3:
                      return date(parts[0], parts[1], parts[2]) > today
                  if len(parts) == 2:
                      return date(parts[0], parts[1], calendar.monthrange(parts[0], parts[1])[1]) >= today
                  return date(parts[0], 12, 31) >= today
              return bool(year) and year > today.year


          def credit_names(item, key, limit):
              block = item.get(key)
              names = []
              if isinstance(block, dict):
                  for edge in block.get("edges") or []:
                      node = (edge or {}).get("node") or {}
                      names.append(((node.get("name") or {}).get("nameText") or {}).get("text"))
              elif isinstance(block, list):
                  for group in block:
                      for credit in (group or {}).get("credits") or []:
                          names.append(((credit.get("name") or {}).get("nameText") or {}).get("text"))
              clean = []
              for n in names:
                  if n and n not in clean:
                      clean.append(n)
              return clean[:limit]


          def short_plot(item):
              text = (((item.get("plot") or {}).get("plotText")) or {}).get("plainText") or ""
              text = " ".join(text.split())
              if len(text) <= 420:
                  return text
              return text[:420].rsplit(" ", 1)[0].rstrip(",;:") + "…"


          def make_title(item, imdb_id):
              title_text = item.get("titleText") or {}
              image = item.get("primaryImage") or {}
              year = (item.get("releaseYear") or {}).get("year")
              kind = item.get("titleType") or {}
              rating = (item.get("ratingsSummary") or {}).get("aggregateRating") or 0
              metascore = ((item.get("metacritic") or {}).get("metascore") or {}).get("score") or 0
              runtime = ((item.get("runtime") or {}).get("seconds") or 0) // 60
              release = release_text(item)
              return {
                  "id": imdb_id,
                  "title": title_text.get("text") or "",
                  "year": year,
                  "type": kind.get("id") or "",
                  "rating": rating,
                  "metascore": metascore,
                  "runtime": runtime,
                  "release": release,
                  "upcoming": is_upcoming(release, year),
                  "genres": extract_genres(item),
                  "poster": image.get("url") or "",
                  "plot": short_plot(item),
                  "directors": credit_names(item, "directors", 2),
                  "cast": credit_names(item, "cast", 5),
                  "imdbUrl": "https://www.imdb.com/title/" + imdb_id + "/",
              }


          def fetch_top(extra, chart):
              for template in TOP_TEMPLATES:
                  for fields in (extra, ""):
                      try:
                          data = query(template.replace("__CHART__", chart).replace("__EXTRA__", fields), {})
                          edges = (data.get("chartTitles") or {}).get("edges") or []
                          items = []
                          for edge in edges:
                              node = (edge or {}).get("node") or {}
                              item = node.get("title") or node
                              if item.get("id"):
                                  items.append(make_title(item, item["id"]))
                          if items:
                              print("Top 10 " + chart + " obtido com: " + template[:48] + " | campos extras: " + ("sim" if fields else "não"))
                              return items[:10]
                          print("Top 10 " + chart + " vazio com: " + template[:48])
                      except Exception as error:
                          print("Top 10 " + chart + " falhou: " + str(error)[:160])
              return []


          def fetch_all(gql, user_id):
              titles = []
              seen = set()
              after = None
              page = 0
              while True:
                  data = query(gql, {"userId": user_id, "first": 50, "after": after})
                  watchlist = data["predefinedList"]
                  if watchlist is None:
                      raise RuntimeError("IMDb Watchlist não encontrada.")
                  connection = watchlist["titleListItemSearch"]
                  edges = connection["edges"]
                  page += 1
                  for edge in edges:
                      item = edge.get("title") or {}
                      imdb_id = item.get("id")
                      if not imdb_id or imdb_id in seen:
                          continue
                      seen.add(imdb_id)
                      titles.append(make_title(item, imdb_id))
                  print(f"Página {page}: {len(edges)} itens; {len(titles)} títulos únicos.")
                  info = connection["pageInfo"]
                  if not info["hasNextPage"]:
                      break
                  if not info.get("endCursor"):
                      raise RuntimeError("IMDb não retornou cursor para a próxima página.")
                  after = info["endCursor"]
              return titles


          def main():
              profile = query(
                  "query($profileId: ID!) { userProfile(input: {profileId: $profileId}) { userId } }",
                  {"profileId": profile_id},
              )
              user_id = profile["userProfile"]["userId"]

              chosen = []
              for options in OPTIONAL:
                  for frag in options:
                      try:
                          probe = TEMPLATE.replace("__EXTRA__", " ".join(chosen + [frag]))
                          query(probe, {"userId": user_id, "first": 1, "after": None})
                          chosen.append(frag)
                          print("Campo ok: " + frag)
                          break
                      except Exception as error:
                          print("Campo recusado: " + frag + " -> " + str(error)[:120])

              base = list(chosen)
              for options in DETAIL:
                  for frag in options:
                      try:
                          probe = TEMPLATE.replace("__EXTRA__", " ".join(chosen + [frag]))
                          query(probe, {"userId": user_id, "first": 1, "after": None})
                          chosen.append(frag)
                          print("Detalhe ok: " + frag[:60])
                          break
                      except Exception as error:
                          print("Detalhe recusado: " + frag[:60] + " -> " + str(error)[:120])

              titles = None
              last_error = None
              for extra in (" ".join(chosen), " ".join(base), ""):
                  try:
                      titles = fetch_all(TEMPLATE.replace("__EXTRA__", extra), user_id)
                      print("Consulta usada: " + (extra or "básica"))
                      break
                  except Exception as error:
                      last_error = error
                      print("Consulta falhou: " + str(error)[:200])

              if not titles:
                  raise RuntimeError("A IMDb não retornou títulos: " + str(last_error))

              stamp = int(datetime.now(timezone.utc).timestamp())
              previous = {}
              previous_top = {}
              try:
                  with open("/tmp/prev.json", encoding="utf-8") as file:
                      old_data = json.load(file)
                  previous = {t["id"]: t for t in old_data.get("titles") or [] if t.get("id")}
                  previous_top = {k: old_data.get(k) or [] for k in CHARTS}
              except Exception as error:
                  print("JSON anterior indisponível: " + str(error)[:120])
              for t in titles:
                  old = previous.get(t["id"])
                  if old is not None:
                      t["addedAt"] = old.get("addedAt") or 0
                  else:
                      t["addedAt"] = stamp if previous else 0
              new_count = sum(1 for t in titles if t["addedAt"] == stamp)
              soon_count = sum(1 for t in titles if t["upcoming"])
              print(f"{new_count} títulos novos na lista; {soon_count} ainda não lançados; {sum(1 for t in titles if t['runtime'])} com duração.")

              tops = {}
              for key, chart in CHARTS.items():
                  tops[key] = fetch_top(" ".join(chosen), chart)
                  if not tops[key]:
                      tops[key] = previous_top.get(key) or []
                      print("Top 10 " + key + " indisponível; mantido o anterior (" + str(len(tops[key])) + " itens).")

              with_plot = sum(1 for t in titles if t["plot"])
              with_cast = sum(1 for t in titles if t["cast"])
              print(f"{with_plot} de {len(titles)} com sinopse; {with_cast} com elenco.")
              with_genres = sum(1 for t in titles if t["genres"])
              with_rating = sum(1 for t in titles if t["rating"])
              with_meta = sum(1 for t in titles if t["metascore"])
              print(f"{with_genres} de {len(titles)} títulos com gênero; {with_rating} com nota; {with_meta} com metascore.")

              output = {
                  "source": "IMDb Watchlist",
                  "profileId": profile_id,
                  "updatedAt": datetime.now(timezone.utc).isoformat(),
                  "count": len(titles),
                  "topMovies": tops["topMovies"],
                  "topSeries": tops["topSeries"],
                  "titles": titles,
              }

              os.makedirs("public", exist_ok=True)
              with open("public/watchlist.json", "w", encoding="utf-8") as file:
                  json.dump(output, file, ensure_ascii=False, separators=(",", ":"))

              print(f"JSON criado com {len(titles)} títulos.")


          main()
          PY

      - name: Publish updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp public/watchlist.json /tmp/watchlist.json

          git fetch origin watchlist-data || true

          if git show-ref --verify --quiet refs/remotes/origin/watchlist-data; then
            git checkout -f -B watchlist-data origin/watchlist-data
          else
            git checkout --orphan watchlist-data
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p public
          cp /tmp/watchlist.json public/watchlist.json
          git add public/watchlist.json

          if git diff --cached --quiet; then
            echo "Watchlist sem alterações; nada para publicar."
          else
            git commit -m "Update IMDb Watchlist JSON"
            git push -u origin watchlist-data
          fi
